[package]
name = "portablephp"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
rfd = "0.14"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"

[build-dependencies]
winres = "0.1"